<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden - AI Email Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: bold;
            color: #4f46e5;
        }

        .logo .sparkle {
            color: #10b981;
            margin-left: 0.5rem;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .description {
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .google-btn:hover {
            background: #3367d6;
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            margin-top: 1rem;
            color: #6b7280;
        }

        .error {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem;
            background: #fef2f2;
            color: #dc2626;
            border-radius: 8px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            📧 Aiden<span class="sparkle">✨</span>
        </div>
        <h1>AI Email Manager</h1>
        <p class="description">
            Connect your Gmail account to experience AI-powered email management, smart categorization, and intelligent priority handling.
        </p>
        <button class="google-btn" onclick="signInWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M17.64 9.20455C17.64 8.56637 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.675 11.97 13.1109 12.9914 12.2618 13.6745V15.9627H15.0809C16.5164 14.6573 17.64 12.6586 17.64 9.20455Z" fill="#4285F4"/>
                <path d="M9 18C11.43 18 13.4673 17.1941 15.0809 15.9627L12.2618 13.6745C11.4618 14.2114 10.4364 14.525 9 14.525C6.65591 14.525 4.67182 13.0477 3.96409 10.9691H1.04636V13.3327C2.65227 16.4932 6.08591 18 9 18Z" fill="#34A853"/>
                <path d="M3.96409 10.9691C3.78409 10.4323 3.68182 9.85682 3.68182 9.27273C3.68182 8.68864 3.78409 8.11318 3.96409 7.57636V5.21273H1.04636C0.378182 6.53455 0 8.03864 0 9.27273C0 10.5068 0.378182 12.0109 1.04636 13.3327L3.96409 10.9691Z" fill="#FBBC05"/>
                <path d="M9 3.75C10.2477 3.75 11.3682 4.18727 12.2755 5.04091L14.7891 2.52727C13.4636 1.34545 11.43 0.545455 9 0.545455C6.08591 0.545455 2.65227 2.05227 1.04636 5.21273L3.96409 7.57636C4.67182 5.49773 6.65591 3.75 9 3.75Z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>
        <div class="loading">Connecting...</div>
        <div class="error"></div>
    </div>

    <script>
        // OAuth configuration
        const CLIENT_ID = '__GOOGLE_CLIENT_ID__';
        const REDIRECT_URI = 'http://localhost:1420/test-oauth.html';
        const SCOPE = 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile';

        // Check for OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (code || error) {
            // Handle OAuth callback
            if (error) {
                document.querySelector('.login-container').innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">❌</div>
                        <h2 style="color: #dc2626; margin-bottom: 1rem;">Sign in failed</h2>
                        <p style="color: #6b7280; margin-bottom: 2rem;">Error: ${error}</p>
                        <button onclick="window.location.href='/simple.html'" style="background: #4f46e5; color: white; padding: 0.75rem 2rem; border: none; border-radius: 8px; cursor: pointer;">Try Again</button>
                    </div>
                `;
            } else {
                document.querySelector('.login-container').innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">🔄</div>
                        <h2 style="color: #4f46e5; margin-bottom: 1rem;">Completing sign in...</h2>
                        <p style="color: #6b7280;">Please wait while we connect your Gmail account.</p>
                    </div>
                `;
                // Exchange code for token
                exchangeCodeForToken(code);
            }
        }

        function signInWithGoogle() {
            const btn = document.querySelector('.google-btn');
            const loading = document.querySelector('.loading');
            const error = document.querySelector('.error');

            btn.style.display = 'none';
            loading.style.display = 'block';
            error.style.display = 'none';

            // Build OAuth URL (simplified without PKCE for now)
            const authUrl = new URL('https://accounts.google.com/oauth/authorize');
            authUrl.searchParams.set('client_id', CLIENT_ID);
            authUrl.searchParams.set('redirect_uri', REDIRECT_URI);
            authUrl.searchParams.set('response_type', 'code');
            authUrl.searchParams.set('scope', SCOPE);
            authUrl.searchParams.set('state', Math.random().toString(36).substring(7));
            authUrl.searchParams.set('access_type', 'offline');
            authUrl.searchParams.set('prompt', 'consent');

            // Redirect to Google OAuth
            window.location.href = authUrl.toString();
        }

        async function exchangeCodeForToken(code) {
            try {
                // Simplified OAuth without PKCE

                // Exchange code for token
                const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        client_secret: '__GOOGLE_CLIENT_SECRET__',
                        code: code,
                        grant_type: 'authorization_code',
                        redirect_uri: REDIRECT_URI,
                      }),
                });

                const tokenData = await tokenResponse.json();

                if (tokenData.error) {
                    throw new Error(tokenData.error_description || tokenData.error);
                }

                // Get user info
                const userResponse = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`,
                    },
                });

                const userData = await userResponse.json();

                // Store tokens
                localStorage.setItem('aiden_access_token', tokenData.access_token);
                localStorage.setItem('aiden_refresh_token', tokenData.refresh_token);
                localStorage.setItem('aiden_user', JSON.stringify(userData));

                // Redirect to main Aiden app
                window.location.href = 'http://localhost:1420/';

            } catch (error) {
                console.error('Token exchange failed:', error);
                document.querySelector('.login-container').innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">❌</div>
                        <h2 style="color: #dc2626; margin-bottom: 1rem;">Sign in failed</h2>
                        <p style="color: #6b7280; margin-bottom: 2rem;">${error.message}</p>
                        <button onclick="window.location.href='/simple.html'" style="background: #4f46e5; color: white; padding: 0.75rem 2rem; border: none; border-radius: 8px; cursor: pointer;">Try Again</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
