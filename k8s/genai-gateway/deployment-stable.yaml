apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-gateway-stable
  namespace: aiden
  labels:
    app: genai-gateway
    track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genai-gateway
      track: stable
  template:
    metadata:
      labels:
        app: genai-gateway
        track: stable
    spec:
      containers:
        - name: genai-gateway
          image: aiden/genai-gateway:stable
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: genai-gateway-config
            - secretRef:
                name: genai-gateway-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
