<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden - AI Email Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', system-ui, sans-serif;
            background: rgb(var(--color-background));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-container {
            background: rgb(var(--color-surface));
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgb(var(--color-border));
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 700;
            color: rgb(var(--color-foreground));
        }

        .logo .sparkle {
            color: #22c55e;
            margin-left: 0.5rem;
        }

        h1 {
            color: rgb(var(--color-foreground));
            margin-bottom: 1rem;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .description {
            color: rgb(var(--color-muted));
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-size: 1rem;
        }

        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 0.875rem 2.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 16px rgba(66, 133, 244, 0.2);
        }

        .google-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(66, 133, 244, 0.3);
        }

        .loading {
            display: none;
            margin-top: 1.5rem;
            color: rgb(var(--color-muted));
            font-size: 0.95rem;
        }

        .error {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fef2f2;
            color: #dc2626;
            border-radius: 12px;
            font-size: 0.875rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            📧 Aiden<span class="sparkle">✨</span>
        </div>
        <h1>AI Email Manager</h1>
        <p class="description">
            Connect your Gmail account to experience AI-powered email management, smart categorization, and intelligent priority handling.
        </p>
        <button class="google-btn" onclick="signInWithGoogle()">

                <path d="M9 18C11.43 18 13.4673 17.1941 15.0809 15.9627L12.2618 13.6745C11.4618 14.2114 10.4364 14.525 9 14.525C6.65591 14.525 4.67182 13.0477 3.96409 10.9691H1.04636V13.3327C2.65227 16.4932 6.08591 18 9 18Z" fill="#34A853"/>
                <path d="M3.96409 10.9691C3.78409 10.4323 3.68182 9.85682 3.68182 9.27273C3.68182 8.68864 3.78409 8.11318 3.96409 7.57636V5.21273H1.04636C0.378182 6.53455 0 8.03864 0 9.27273C0 10.5068 0.378182 12.0109 1.04636 13.3327L3.96409 10.9691Z" fill="#FBBC05"/>
                <path d="M9 3.75C10.2477 3.75 11.3682 4.18727 12.2755 5.04091L14.7891 2.52727C13.4636 1.34545 11.43 0.545455 9 0.545455C6.08591 0.545455 2.65227 2.05227 1.04636 5.21273L3.96409 7.57636C4.67182 5.49773 6.65591 3.75 9 3.75Z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>
        <div class="loading">Connecting...</div>
        <div class="error"></div>
    </div>

        function signInWithGoogle() {

            authUrl.searchParams.set('flowName', 'GeneralOAuthFlow');

</body>
</html>
