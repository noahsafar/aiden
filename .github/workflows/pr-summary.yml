name: PR Summary with Claude

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff and summarize
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            // Fetch the PR diff
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              mediaType: { format: 'diff' }
            });

            // Truncate diff if too large (keep under ~10K chars for API limits)
            const MAX_DIFF_LENGTH = 10000;
            let truncatedDiff = diff;
            let wasTruncated = false;
            if (diff.length > MAX_DIFF_LENGTH) {
              truncatedDiff = diff.substring(0, MAX_DIFF_LENGTH);
              wasTruncated = true;
            }

            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || 'No description provided.';

            // Call Claude API
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-5-20250929',
                max_tokens: 1024,
                messages: [{
                  role: 'user',
                  content: `You are a code reviewer. Summarize the following pull request changes concisely.

            PR Title: ${prTitle}
            PR Description: ${prBody}

            Diff${wasTruncated ? ' (truncated)' : ''}:
            \`\`\`diff
            ${truncatedDiff}
            \`\`\`

            Provide:
            1. A brief summary of what this PR does (2-3 sentences)
            2. Key changes (bulleted list of the most important modifications)
            3. Any potential concerns or suggestions (if applicable)

            Keep the response concise and actionable.`
                }]
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Claude API error: ${response.status} ${errorText}`);
              return;
            }

            const result = await response.json();
            const summary = result.content[0].text;

            // Post or update the comment on the PR
            const commentMarker = '<!-- pr-summary-bot -->';
            const commentBody = `${commentMarker}\n## PR Summary (AI-Generated)\n\n${summary}\n\n---\n*Generated by Claude (claude-sonnet-4-5-20250929)*`;

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existingComment = comments.find(c => c.body.includes(commentMarker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              core.info('Updated existing PR summary comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
              core.info('Posted new PR summary comment.');
            }
