name: PR Summary with Claude

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff and summarize
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            // Fetch the PR diff — fall back to file list if diff is too large
            let diff = '';
            let wasTruncated = false;
            const MAX_DIFF_LENGTH = 10000;

            try {
              const { data: rawDiff } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                mediaType: { format: 'diff' }
              });
              diff = rawDiff;
            } catch (e) {
              // Diff too large (>20K lines) — build a summary from the file list instead
              core.info(`Full diff unavailable (${e.message}), falling back to file list.`);
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              });
              const fileSummaries = files.map(f =>
                `${f.status} ${f.filename} (+${f.additions} -${f.deletions})`
              );
              diff = `File list (full diff too large):\n${fileSummaries.join('\n')}`;
              // Include patches for the most important files (non-log, non-json)
              const importantFiles = files
                .filter(f => f.patch && !f.filename.match(/\.(log|json)$/) && !f.filename.includes('/logs/'))
                .slice(0, 10);
              for (const f of importantFiles) {
                diff += `\n\n--- ${f.filename} ---\n${f.patch}`;
              }
            }

            let truncatedDiff = diff;
            if (diff.length > MAX_DIFF_LENGTH) {
              truncatedDiff = diff.substring(0, MAX_DIFF_LENGTH);
              wasTruncated = true;
            }

            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || 'No description provided.';

            // Call Claude API
            const response = await fetch('https://api.z.ai/api/anthropic/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-5-20250929',
                max_tokens: 1024,
                messages: [{
                  role: 'user',
                  content: `You are a code reviewer. Summarize the following pull request changes concisely.

            PR Title: ${prTitle}
            PR Description: ${prBody}

            Diff${wasTruncated ? ' (truncated)' : ''}:
            \`\`\`diff
            ${truncatedDiff}
            \`\`\`

            Provide:
            1. A brief summary of what this PR does (2-3 sentences)
            2. Key changes (bulleted list of the most important modifications)
            3. Any potential concerns or suggestions (if applicable)

            Keep the response concise and actionable.`
                }]
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Claude API error: ${response.status} ${errorText}`);
              return;
            }

            const result = await response.json();
            const summary = result.content[0].text;

            // Post or update the comment on the PR
            const commentMarker = '<!-- pr-summary-bot -->';
            const commentBody = `${commentMarker}\n## PR Summary (AI-Generated)\n\n${summary}\n\n---\n*Generated by Claude (claude-sonnet-4-5-20250929)*`;

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existingComment = comments.find(c => c.body.includes(commentMarker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              core.info('Updated existing PR summary comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
              core.info('Posted new PR summary comment.');
            }
