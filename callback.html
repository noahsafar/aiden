<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Callback - Aiden</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .callback-container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .spinner {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h2 {
            color: #4f46e5;
            margin-bottom: 1rem;
        }

        .message {
            color: #6b7280;
            line-height: 1.6;
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .success {
            color: #059669;
            background: #ecfdf5;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner">🔄</div>
        <h2>Completing sign in...</h2>
        <p class="message">Please wait while we connect your Gmail account.</p>
        <div id="status"></div>
    </div>

    <script>
        // OAuth configuration
        const CLIENT_ID = '__GOOGLE_CLIENT_ID__';
        const CLIENT_SECRET = '__GOOGLE_CLIENT_SECRET__';
        const REDIRECT_URI = 'http://localhost:1420/callback.html';

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const state = urlParams.get('state');

        const statusDiv = document.getElementById('status');

        async function handleCallback() {
            try {
                if (error) {
                    throw new Error(`OAuth Error: ${error}`);
                }

                if (!code) {
                    throw new Error('No authorization code received');
                }

                // Simplified OAuth without PKCE for client-side demo

                statusDiv.innerHTML = '<div class="message">Exchanging authorization code for access token...</div>';

                // Exchange code for token
                const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        client_secret: CLIENT_SECRET,
                        code: code,
                        grant_type: 'authorization_code',
                        redirect_uri: REDIRECT_URI,
                      }),
                });

                const tokenData = await tokenResponse.json();

                if (tokenData.error) {
                    throw new Error(tokenData.error_description || tokenData.error);
                }

                statusDiv.innerHTML = '<div class="success">✅ Successfully authenticated!</div>';

                // Get user info
                const userResponse = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`,
                    },
                });

                const userData = await userResponse.json();

                statusDiv.innerHTML += '<div class="message">Welcome, ' + userData.name + '! Redirecting to dashboard...</div>';

                // Store tokens and user data
                localStorage.setItem('aiden_access_token', tokenData.access_token);
                localStorage.setItem('aiden_refresh_token', tokenData.refresh_token || '');
                localStorage.setItem('aiden_user', JSON.stringify(userData));
                localStorage.setItem('aiden_authenticated', 'true');

                // Clear URL parameters
                window.history.replaceState({}, document.title, window.location.pathname);

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 2000);

            } catch (error) {
                console.error('OAuth callback failed:', error);
                statusDiv.innerHTML = `
                    <div class="error">
                        ❌ Authentication failed: ${error.message}
                    </div>
                    <button onclick="window.location.href='/simple.html'" style="
                        background: #4f46e5;
                        color: white;
                        padding: 0.75rem 2rem;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        margin-top: 1rem;
                    ">Try Again</button>
                `;
            }
        }

        // Handle callback immediately
        handleCallback();
    </script>
</body>
</html>
